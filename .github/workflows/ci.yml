# Checks every ready PR (typecheck, tests, build, browser suite, commitlint) and push to main; on main, applies D1 migrations and deploys. Drafts skip the expensive jobs; docs-only PRs pass them without running their steps (D117, D125).
# Secrets (repo settings → Secrets → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Save Actions minutes (D117): a newer push to the same PR cancels the older
# run. Runs on main are never cancelled (they deploy), so they get a group of
# their own per commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a PR needs `check` and `e2e` (D117). A draft PR runs
  # nothing but this skip; "Ready for review" starts the full run. A PR that
  # only changes documentation skips both. Markdown the app or the tests read
  # counts as code: docs/szabalyzat.md (the /rules page), docs/walkthrough.md
  # (seed test) and .claude/agents/e2e-tester.md (e2e spec 00).
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # On any error (a huge PR, an API hiccup) run everything.
          if ! files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only); then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(printf '%s\n' "$files" | grep -v '^$' | grep -vE '^(README\.md|CLAUDE\.md|docs/.+\.md)$' | head -1 || true)
          code+=$(printf '%s\n' "$files" | grep -E '^docs/(szabalyzat|walkthrough)\.md$' | head -1 || true)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "Changed files:"; printf '%s\n' "$files"

  # A draft run skips its jobs, and GitHub counts a skipped required check
  # as passed. Marking a PR ready right after a push gives the same commit a
  # draft run and a real run, and the draft run's skipped check can land
  # last and stand for the real one (seen on #324). So in a draft run the
  # required jobs carry other names ("... (draft)"), which no ruleset
  # requires (D120).
  #
  # A job skipped by its `if` keeps its name unevaluated (the raw `${{ }}`
  # text), so a skipped `check` or `e2e` never reports under the name the
  # ruleset requires and blocks the merge. So in a ready run both jobs always
  # start, and a docs-only PR skips their steps instead: the job passes in
  # seconds under its real name (D125). In a draft run they stay skipped.
  check:
    name: ${{ github.event.pull_request.draft && 'check (draft)' || 'check' }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "Documentation only, nothing to check (D117)."
      - if: env.RUN == 'true'
        uses: actions/checkout@v5
      - if: env.RUN == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - if: env.RUN == 'true'
        run: npm run typecheck
      - if: env.RUN == 'true'
        run: npm test
      - if: env.RUN == 'true'
        run: npm run build

  # The browser suite (#102): `npm run e2e` walks through milestone 1 in
  # Chromium on its own local D1 and a dev server without a Resend key, so
  # it needs no secrets and sends no email. Runs next to `check` on every
  # ready PR that changes code (D117).
  e2e:
    name: ${{ github.event.pull_request.draft && 'e2e (draft)' || 'e2e' }}
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN: ${{ needs.changes.outputs.code == 'true' }}
    # Read-only token, no `secrets`: nothing of Cloudflare or Resend reaches this job.
    permissions:
      contents: read
    steps:
      - if: env.RUN != 'true'
        run: echo "Documentation only, no browser suite (D117)."
      - if: env.RUN == 'true'
        uses: actions/checkout@v5
      - if: env.RUN == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - if: env.RUN == 'true'
        name: Get the Playwright version
        id: playwright
        run: echo "version=$(npx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: app
      - if: env.RUN == 'true'
        name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: ubuntu-latest already has every library Chromium links
      # against (the apt step only added fonts and xvfb, and once took 10
      # minutes on a slow mirror). A missing library fails the run loudly.
      # With a cache hit this only checks that the browser is there.
      - if: env.RUN == 'true'
        name: Install Chromium
        run: npx --no-install playwright install chromium
        working-directory: app
      - if: env.RUN == 'true'
        run: npm run e2e
      - if: ${{ !cancelled() && env.RUN == 'true' }}
        name: Upload the Playwright report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          # The HTML report plus the trace and screenshots of each failed test,
          # and the dev server's log (the emails it printed contain only fake data).
          path: |
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/.state/server.log
          # app/e2e/.state is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  commitlint:
    name: ${{ github.event.pull_request.draft && 'commitlint (draft)' || 'commitlint' }}
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the PR's own commits; history before CI isn't conventional.
      - run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # `changes` is skipped on a push to main, and GitHub's implicit success()
  # skips every job below a skipped one, `check` passing or not. So deploy
  # checks `check` itself (D122): without this, the 2026-11-06 release
  # (#327) passed `check` and skipped `deploy`.
  deploy:
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://padelparbaj.hu
    # One deploy at a time; a newer push waits instead of racing.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations first: if one fails, the job stops and the old code keeps running.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: d1 migrations apply DB --remote
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy
